<section id="services" class="section">
  <div class="container-x">
    <app-section-heading
      [eyebrow]="content().ui.services.eyebrow"
      [title]="content().ui.services.title"
      [highlight]="content().ui.services.highlight"
      [subtitle]="content().ui.services.subtitle"
    />

    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      @for (service of content().services; track service.title; let i = $index) {
        <article
          appTilt
          [max]="6"
          class="card-surface group relative flex flex-col overflow-hidden p-6"
          data-aos="fade-up"
          [attr.data-aos-delay]="i * 90"
        >
          <span
            class="bg-blob-accent pointer-events-none absolute -right-10 -top-10 h-28 w-28 rounded-full opacity-0 blur-2xl transition-opacity duration-500 group-hover:opacity-100"
            aria-hidden="true"
          ></span>

          <span
            class="relative grid h-12 w-12 place-items-center rounded-2xl text-white shadow-glow transition-transform duration-500 group-hover:-rotate-6"
            style="background: linear-gradient(120deg, rgb(var(--accent)), rgb(var(--accent-cyan)))"
          >
            <app-icon [name]="service.icon" [size]="22" />
          </span>

          <h3 class="relative mt-5 font-display text-base font-semibold">{{ service.title }}</h3>
          <p class="relative mt-2 text-sm leading-relaxed text-muted">{{ service.description }}</p>

          <ul class="relative mt-4 space-y-1.5">
            @for (point of service.points; track point) {
              <li class="flex gap-2 text-xs text-muted">
                <span class="mt-0.5 text-accent"><app-icon name="check" [size]="13" /></span>
                {{ point }}
              </li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
